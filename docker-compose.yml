services:
  # MPD — music playback daemon (Phase 8).
  # Audio output: PulseAudio socket mounted from the host (PipeWire-PA compatible).
  # Music files: ${MUSIC_PATH} (set in .env) mounted read-only at /music.
  # If your UID is not 1000, update mpd/mpd.conf and the socket path below.
  mpd:
    image: vimagick/mpd
    container_name: assistant-mpd
    restart: unless-stopped
    command: ["mpd", "--stdout", "--no-daemon", "/config/mpd.conf"]
    # Keep MPD's control port internal to the compose network (use `expose`) to
    # avoid conflicts with any host MPD instance.
    # The HTTP stream (:8800) is not published either: Caddy proxies
    # /music/stream to mpd:8800 over the compose network, behind HTTPS.
    expose:
      - "6600"
      - "8800"
    volumes:
      - ./mpd:/config
      # Long syntax with create_host_path: false — if MUSIC_PATH is missing (e.g. a
      # network share not mounted yet) the container fails to start instead of
      # Docker silently creating an empty root-owned directory.
      - type: bind
        source: ${MUSIC_PATH}
        target: /music
        read_only: true
        bind:
          create_host_path: false
      - ./mpd/playlists:/config/playlists
      # PulseAudio socket for host user (PipeWire-pulse compatibility)
      - ${PULSE_SOCKET}:${PULSE_SOCKET}:ro
    devices:
      - /dev/snd
    environment:
      - TZ=UTC
      - PUID=${PUID}
      - PGID=${PGID}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=unix:${PULSE_SOCKET}
    healthcheck:
      test: ["CMD-SHELL", "mpc status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    container_name: assistant-backend
    restart: unless-stopped
    # Port 8000 is NOT published to the host — all browser traffic enters via
    # Caddy (HTTPS). The backend is reachable inside the Docker network only.
    expose:
      - "8000"
    # llama.cpp servers run on the host (ports 10000/10001); expose the
    # host gateway so the container can reach them via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Beets DB mounted from host (read-only). Override BEETS_DB_PATH in
      # .env if the DB filename differs. Host directory set via BEETS_DB_DIR.
      - BEETS_DB_PATH=${BEETS_DB_PATH:-/beets/library.db}
      # Runtime state DBs on the persistent hearth-data volume so users,
      # sessions, memory, and conversation history survive container rebuilds.
      - MEMORY_DB_PATH=/tmp/hearth/memory.db
      - CHROMA_PATH=/tmp/hearth/chroma
      - GRAPH_CHECKPOINT_DB_PATH=/tmp/hearth/graph-checkpoints.sqlite
      - AUTH_DB_PATH=/tmp/hearth/auth.db
      - MUSIC_ROOT=/music
      - BEETSDIR=/beets
      - MPD_HOST=mpd
      - TTS_ENGINE=${TTS_ENGINE:-kokoro}
      - TTS_KOKORO_MODEL=${TTS_KOKORO_MODEL:-/app/models/tts/kokoro-v1.0.int8.onnx}
      - TTS_KOKORO_VOICES=${TTS_KOKORO_VOICES:-/app/models/tts/voices-v1.0.bin}
      - TTS_KOKORO_VOICE=${TTS_KOKORO_VOICE:-af_heart}
      - TTS_KOKORO_LANG=${TTS_KOKORO_LANG:-en-us}
      - TTS_KOKORO_SPEED=${TTS_KOKORO_SPEED:-1.0}
    depends_on:
      - mpd
    volumes:
      - hearth-data:/tmp/hearth
      - ./backend:/app
      - ./frontend:/frontend
      # Music library — writable so beets import can create temp files during remux.
      - type: bind
        source: ${MUSIC_PATH}
        target: /music
        bind:
          create_host_path: false
      # Beets library DB directory — mounted read-only so backend can query items.
      # Set BEETS_DB_DIR in .env to the directory containing library.db.
      - ${BEETS_DB_DIR}:/beets
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous grace period: the startup chat-model warmup (see
      # main._graph_lifespan) can take ~80s to load gemma4:e4b before the app
      # starts serving /health. Without this the container would flip unhealthy
      # mid-warmup.
      start_period: 120s

  # Caddy terminates TLS and reverse-proxies to the backend.
  # Certificates (mkcert or `tailscale cert`) are mounted read-only from
  # caddy/certs. See README — HTTPS Setup section.
  # HEARTH_BIND_IP / HEARTH_HTTPS_PORT pick the host address: set them to share
  # a machine with another :443 reverse proxy (e.g. a Tailscale IP on :8443).
  # Plain HTTP (:80) is not published: open https:// directly.
  caddy:
    image: caddy:2-alpine
    container_name: assistant-caddy
    restart: unless-stopped
    ports:
      - "${HEARTH_BIND_IP:-0.0.0.0}:${HEARTH_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  hearth-data:
