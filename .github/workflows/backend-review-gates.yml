name: backend-review-gates

# Remote quality gate (GitHub Actions) mirroring scripts/review_baseline.sh.
# Required (blocking): focused regression tests + gitleaks secret scan.
# Advisory (continue-on-error): pip-audit + bandit — these run locally only when
# installed and are intentionally non-blocking so a fresh vuln DB / a static
# finding never hard-blocks a merge. Keep this file in sync with
# scripts/review_baseline.sh (same test list, same scanner flags).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-review-gates:
    name: backend-review-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans all commits and changed-file diffs
          # against origin/main can resolve.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install security tools
        run: python -m pip install bandit pip-audit

      - name: Install gitleaks
        run: |
          GL_VER=8.18.4
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin
          gitleaks version

      - name: Run focused regression tests
        run: |
          python -m pytest \
            backend/tests/test_auth.py \
            backend/tests/test_router.py \
            backend/tests/test_graph.py \
            backend/tests/test_memory_isolation.py \
            backend/tests/test_weather.py \
            -q

      - name: Secret scan (gitleaks)
        run: gitleaks detect --no-banner --source . --redact --exit-code 1

      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: python -m pip_audit -r backend/requirements.txt --progress-spinner off --ignore-vuln CVE-2026-45829

      - name: Static security scan (bandit, advisory)
        continue-on-error: true
        run: python -m bandit -q -ll -r backend -x backend/tests,backend/.venv,backend/chroma,backend/models,backend/__pycache__
